<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanPulse" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purplePulse" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Scanline effect -->
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Text Readability -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.8" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scanBeam {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(340px); }
    }
    @keyframes nodeFlash {
      0%, 100% { fill: #38bdf8; r: 4px; opacity: 0.5; }
      50% { fill: #34d399; r: 7px; opacity: 1; }
    }

    .bg-grid { stroke: #334155; stroke-width: 0.5; opacity: 0.25; }
    .radar-line { transform-origin: 780px 160px; animation: radarSweep 12s linear infinite; stroke: #38bdf8; stroke-width: 1.5; opacity: 0.4; }
    .scan-bar { animation: scanBeam 6s ease-in-out infinite; }
    .pill-1 { animation: floatPill 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill 5s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 4.5s ease-in-out infinite 2s; }
    .g-node { animation: nodeFlash 3s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="960" height="320" rx="16" fill="url(#bgGlow)" />
  <rect width="960" height="320" rx="16" fill="url(#cyanPulse)" />
  <rect width="960" height="320" rx="16" fill="url(#purplePulse)" />

  <!-- Background Animated Grid -->
  <g class="bg-grid">
    <path d="M0,40 H960 M0,80 H960 M0,120 H960 M0,160 H960 M0,200 H960 M0,240 H960 M0,280 H960" />
    <path d="M80,0 V320 M160,0 V320 M240,0 V320 M320,0 V320 M400,0 V320 M480,0 V320 M560,0 V320 M640,0 V320 M720,0 V320 M800,0 V320 M880,0 V320" />
  </g>

  <!-- Animated Scan Beam in Background -->
  <rect class="scan-bar" x="0" y="0" width="960" height="40" fill="url(#scanLine)" opacity="0.4" />

  <!-- Background Graph & Radar Graphic (Right Side) -->
  <g opacity="0.35">
    <circle cx="780" cy="160" r="110" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="780" cy="160" r="75" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
    <circle cx="780" cy="160" r="40" fill="none" stroke="#8b5cf6" stroke-width="1" />
    <line class="radar-line" x1="780" y1="160" x2="890" y2="160" />

    <!-- Network Connection Nodes -->
    <path d="M680,90 L730,130 L810,100 L850,170 L790,220 L710,210 Z" fill="none" stroke="#64748b" stroke-width="1" />
    <circle cx="680" cy="90" r="4" class="g-node" />
    <circle cx="730" cy="130" r="4" fill="#38bdf8" />
    <circle cx="810" cy="100" r="5" class="g-node" />
    <circle cx="850" cy="170" r="4" fill="#8b5cf6" />
    <circle cx="790" cy="220" r="6" class="g-node" />
    <circle cx="710" cy="210" r="4" fill="#38bdf8" />
  </g>

  <!-- Background Floating Decorative Dynamic Pills (Subtle, shifted right/top) -->
  <g filter="url(#badgeShadow)" opacity="0.85">
    <!-- Pill 1: CSPM -->
    <g class="pill-1" transform="translate(640, 45)">
      <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="45" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🛡️ CSPM</text>
    </g>
    <!-- Pill 2: SSPM -->
    <g class="pill-2" transform="translate(750, 35)">
      <rect width="90" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
      <text x="45" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">☁️ SSPM</text>
    </g>
    <!-- Pill 3: Compliance -->
    <g class="pill-3" transform="translate(810, 245)">
      <rect width="115" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
      <text x="57" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✅ COMPLIANCE</text>
    </g>
  </g>

  <!-- Foreground Content Container (Guaranteed Clear Foreground Readability) -->
  <!-- Main Shield Logo (Left) -->
  <g transform="translate(50, 65)">
    <!-- Shield Outer -->
    <path d="M40 0 L80 18 V55 C80 82 40 100 40 100 C40 100 0 82 0 55 V18 L40 0 Z" fill="url(#shieldGrad)" filter="url(#badgeShadow)" />
    <!-- Checkmark inside Shield -->
    <path d="M26 48 L36 58 L56 36" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Main Title & Subtitle (Layered explicitly on top with dark drop shadow) -->
  <g transform="translate(155, 0)" filter="url(#textGlow)">
    <!-- Top Category Tag -->
    <rect x="0" y="52" width="225" height="24" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <text x="12" y="68" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED SECURITY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome Security Health Assessment
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="165" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Cloud Security Posture (CSPM), SaaS Security (SSPM) &amp; Open-Source Scanners
    </text>

    <!-- Subtitle Line 2 / Value Prop -->
    <text x="0" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Continuous Posture Monitoring • Benchmark Auditing • Policy-as-Code • Risk Remediation
    </text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 225)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="105" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
      <text x="52" y="16" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔍 Multi-Cloud</text>

      <!-- Badge 2 -->
      <rect x="115" y="0" width="115" height="24" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.8" />
      <text x="172" y="16" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Open-Source</text>

      <!-- Badge 3 -->
      <rect x="240" y="0" width="105" height="24" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
      <text x="292" y="16" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">📋 CIS / NIST</text>

      <!-- Badge 4 -->
      <rect x="355" y="0" width="115" height="24" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8" />
      <text x="412" y="16" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">📈 Enterprise SaaS</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="314" width="960" height="6" rx="3" fill="url(#shieldGrad)" />
</svg>
