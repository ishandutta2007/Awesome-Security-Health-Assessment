<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 960 320"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="40%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><radialGradient id="cyanPulse" cx="20%" cy="30%" r="60%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="purplePulse" cx="80%" cy="70%" r="60%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="scanLine" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><filter id="textGlow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".9" stdDeviation="6"/><feDropShadow dx="0" dy="0" flood-color="#0f172a" flood-opacity=".8" stdDeviation="10"/></filter><filter id="badgeShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity=".6" stdDeviation="4"/></filter></defs><style>@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes scanBeam{0%{transform:translateY(-100px)}}@keyframes nodeFlash{0%{fill:#38bdf8;r:4px;opacity:.5}50%{fill:#34d399;r:7px;opacity:1}}.bg-grid{stroke:#334155;stroke-width:.5;opacity:.25}.radar-line{transform-origin:780px 160px;animation:radarSweep 12s linear infinite;stroke:#38bdf8;stroke-width:1.5;opacity:.4}.scan-bar{animation:scanBeam 6s ease-in-out infinite}.pill-1{animation:floatPill 4s ease-in-out infinite}.pill-2{animation:floatPill 5s ease-in-out infinite 1s}.pill-3{animation:floatPill 4.5s ease-in-out infinite 2s}.g-node{animation:nodeFlash 3s ease-in-out infinite}</style><rect width="960" height="320" fill="url(#bgGlow)" rx="16"/><rect width="960" height="320" fill="url(#cyanPulse)" rx="16"/><rect width="960" height="320" fill="url(#purplePulse)" rx="16"/><g class="bg-grid"><path d="M0,40 H960 M0,80 H960 M0,120 H960 M0,160 H960 M0,200 H960 M0,240 H960 M0,280 H960"/><path d="M80,0 V320 M160,0 V320 M240,0 V320 M320,0 V320 M400,0 V320 M480,0 V320 M560,0 V320 M640,0 V320 M720,0 V320 M800,0 V320 M880,0 V320"/></g><rect width="960" height="40" x="0" y="0" fill="url(#scanLine)" class="scan-bar" opacity=".4"/><g opacity=".35"><circle cx="780" cy="160" r="110" fill="none" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="780" cy="160" r="75" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".6"/><circle cx="780" cy="160" r="40" fill="none" stroke="#8b5cf6" stroke-width="1"/><line x1="780" x2="890" y1="160" y2="160" class="radar-line"/><path fill="none" stroke="#64748b" stroke-width="1" d="M680,90 L730,130 L810,100 L850,170 L790,220 L710,210 Z"/><circle cx="680" cy="90" r="4" class="g-node"/><circle cx="730" cy="130" r="4" fill="#38bdf8"/><circle cx="810" cy="100" r="5" class="g-node"/><circle cx="850" cy="170" r="4" fill="#8b5cf6"/><circle cx="790" cy="220" r="6" class="g-node"/><circle cx="710" cy="210" r="4" fill="#38bdf8"/></g><g filter="url(#badgeShadow)" opacity=".85"><g class="pill-1" transform="translate(640, 45)"><rect width="90" height="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="14"/><text x="45" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="1